name: tests

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '0 1 * * 4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container || format('python:{0}', matrix.python-version) }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.6', '3.7', '3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - python-version: '3.14'
            container: 'python:3.14-rc'

    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-tests.txt
      - name: Test
        run: pytest test_ttyscan.py --strict-markers --verbose --durations=50 --cov=ttyscan --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    container: python:3.14
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install flake8 autopep8
      - name: Lint
        run: flake8 ttyscan.py test_ttyscan.py
      - name: Format check
        run: autopep8 --diff --aggressive --aggressive ttyscan.py test_ttyscan.py | tee autopep8.diff && test ! -s autopep8.diff
